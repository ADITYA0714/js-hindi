<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure aur Bihari</title>
</head>
<body style="background-color: #313131;">
    <button id="orange">Orange</button>
    <button id="green">Green</button>
</body>
<script>
    // In this example, the function `displayName` is returned.
    // Because of closure, it also remembers variables from its outer function `init` i.e returns lexical scope.
    // Even after `init()` finishes, the returned function can still access `name`.
    function init() {
        let name = "Mozilla"; 
        function displayName() {
            console.log(name); 
        }
        return displayName();
    }
    const myfunn = init();  
    myfunn()
    // Closure means: when a function is created inside another function, 
    // it remembers the variables from the outer function even after the outer function has finished running.

    function init() {
        let name = "Mozilla"; 
        function displayName() {
            console.log(name); 
        }
        return displayName();
    }
    const myfun = init();  
    myfun()  

    function outer(){
        let username = "hitesh"
        // console.log("OUTER", secret);
        function inner(){
            let secret = "my123"
            console.log("inner", username);
        }
        function innerTwo(){
            console.log("innerTwo", username);
            console.log(secret);
        }
        inner()
        // innerTwo()

    }
    outer()
    // console.log("TOO OUTER", username);
</script>

<script>
    // document.getElementById("orange").onclick = function(){
    //     document.body.style.backgroundColor = `orange`
    // }
    // document.getElementById("green").onclick = function(){
    //     document.body.style.backgroundColor = `green`
    // }

    function clickHandler(color){
        // document.body.style.backgroundColor = `${color}`

        return function(){
            document.body.style.backgroundColor = `${color}`
        }
    }

    document.getElementById('orange').onclick = clickHandler("orange")
    document.getElementById('green').onclick = clickHandler("green")
    </script>
</html>
